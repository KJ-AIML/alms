[project]
name = "openai-compatible-custom-probe"
version = "0.0.0"
description = "ALMS Compatibility Lab C0: OpenAI-compatible custom endpoint lane (research only)."
requires-python = ">=3.13"
dependencies = [
    "openai==2.45.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
