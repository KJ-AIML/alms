[project]
name = "litellm-sdk-probe"
version = "0.0.0"
description = "ALMS Phase 0 audit probe: LiteLLM Python SDK abstraction lane. Research infrastructure only. NOT the LiteLLM Proxy Server."
requires-python = ">=3.13"
# Isolation (DevSpec Sections 20 and 25): the LiteLLM SDK lives ONLY in this probe env. The
# central harness must never depend on litellm. This lane audits litellm.completion (the SDK's
# Chat-Completions-shaped abstraction), NOT the LiteLLM Proxy Server, virtual keys, or router.
dependencies = [
    "litellm==1.92.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Anchor rootdir here so the probe never inherits another project's pytest config.
testpaths = ["tests"]
