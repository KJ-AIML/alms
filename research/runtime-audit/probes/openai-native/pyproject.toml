[project]
name = "openai-native-probe"
version = "0.0.0"
description = "ALMS Phase 0 audit probe: OpenAI native (Responses API). Research infrastructure only."
requires-python = ">=3.13"
# Isolation (DevSpec Sections 20 and 25): the OpenAI SDK lives ONLY in this probe env.
# The central harness must never depend on a provider SDK.
dependencies = [
    "openai==2.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Anchor rootdir here so the probe never inherits another project's pytest config.
testpaths = ["tests"]
