[project]
name = "gemini-native-probe"
version = "0.0.0"
description = "ALMS Phase 0 audit probe: Gemini native (Interactions API). Research infrastructure only."
requires-python = ">=3.13"
# Isolation (DevSpec Sections 20 and 25): the google-genai SDK lives ONLY in this probe env.
# The central harness must never depend on a provider SDK. This lane preserves Gemini
# Interactions-native semantics (Interaction resource, steps, response_format, native stream
# events) to challenge OpenAI-shaped assumptions; it does not reshape them into OpenAI forms.
dependencies = [
    "google-genai==2.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Anchor rootdir here so the probe never inherits another project's pytest config.
testpaths = ["tests"]
