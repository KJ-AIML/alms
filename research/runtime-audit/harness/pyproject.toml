[project]
name = "alms-audit"
version = "0.0.0"
description = "ALMS Phase 0 Runtime Audit Lab harness — research/audit infrastructure ONLY, not the ALMS runtime."
requires-python = ">=3.13"
# Isolation rule (DevSpec Section 20 and Section 25): the harness may use common utilities such as
# JSON Schema validation and TOML parsing, but must NOT depend on any runtime SDK
# (openai, anthropic, google-genai, langchain, litellm, pydantic-ai, mirascope).
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]
alms-audit = "alms_audit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alms_audit"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Anchor rootdir here so the harness never inherits the parent repo's pytest.ini.
testpaths = ["tests"]
