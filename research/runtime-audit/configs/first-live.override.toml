# Bounded configuration for the FIRST live provider run only (DevSpec Section 80).
# Tighter than audit.default.toml; it never weakens the global defaults, it only overrides
# them for a single deliberate first-live acceptance run. Contains no secret and no model
# (the model is supplied explicitly at execution time, never defaulted here). Loading is
# fail-closed: a missing file raises rather than falling back to a larger budget.

[budget]
hard_cap_usd = 1.00      # first-live hard cap; a live run is refused if absent/0
soft_cap_usd = 0.25      # per-run soft cap (advisory)
max_live_calls = 8       # first-live hard ceiling on provider calls

[execution]
max_output_tokens = 128
default_timeout_ms = 30000
retries = 0              # no automatic audit retries; the SDK client also sets max_retries=0

# The only fixtures eligible for the FIRST live acceptance run. Enforced by the selection
# layer for this override config only; the generic corpus is unrestricted. Adding an
# unapproved fixture to a first-live run is refused before any provider call.
[live_acceptance]
approved_fixtures = ["GEN-001", "ROLE-001", "STR-001", "TOOL-001", "STREAM-001", "USAGE-001"]

# Committed, non-secret pricing snapshot for the selected low-cost OpenAI model. Prices are
# strings so budget arithmetic stays exact Decimal, never binary float. Never fetched at
# runtime and never silently updated; recorded by digest in each run manifest. The estimate
# it feeds is a safety upper bound, not an accounting claim. price_checked_at 2026-07-13.
# model_id is the EXACT OpenAI snapshot gpt-5.4-nano-2026-03-17 (not the moving alias
# gpt-5.4-nano) for reproducible audit evidence; it must equal the --model passed at run
# time (pricing.gate_cost refuses on model/snapshot mismatch). Cached-input is $0.02/1M per
# official docs but is intentionally NOT modelled here: the upper bound uses full input
# price (more conservative) with retries=0, so caching cannot raise the bound.
[[pricing]]
model_id = "gpt-5.4-nano-2026-03-17"
price_checked_at = "2026-07-13"
input_price_per_million = "0.20"      # USD per 1M input tokens (official; cached-in $0.02)
output_price_per_million = "1.25"     # USD per 1M output tokens
estimated_input_tokens_per_call = 500 # generous upper estimate for the bounded fixtures
maximum_output_tokens_per_call = 128  # equals [execution].max_output_tokens
maximum_calls = 8                     # equals [budget].max_live_calls
pricing_source_note = "gpt-5.4-nano-2026-03-17 exact snapshot (released 2026-03-17); developers.openai.com model + pricing docs, reconfirmed 2026-07-13: in $0.20 / cached-in $0.02 / out $1.25 per 1M"
